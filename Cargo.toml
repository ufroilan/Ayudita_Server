[package]
name = "ayudita-comandas"
version = "0.1.2"
edition = "2024"
description = "Imprime las comandas de Ayudita en una impresora térmica"

[dependencies]
anyhow = "1.0.104"
auto-launch = "0.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
directories = "6.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
env_logger = "0.11.11"
futures-util = "0.3.34"
keyring = "4.2.0"
log = "0.4.34"
nusb = "0.2.8"
png = "0.18.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
single-instance = "0.3.3"
tokio = { version = "1.53.3", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Security"] }

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1.34"
